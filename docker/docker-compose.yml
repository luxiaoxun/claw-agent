version: '3.8'

services:
  backend:
    image: soma-backend:1.0.0-minimal
    container_name: soma-backend
    network_mode: host
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_MODEL_PROVIDER=${LLM_MODEL_PROVIDER:-openai}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - CONTEXT_STRATEGY=${CONTEXT_STRATEGY:-round}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - /home/work/soma/docker/workspace:/app/workspace
      - /home/work/soma/docker/logs:/app/logs
    restart: unless-stopped

  frontend:
    image: soma-frontend:1.0.0
    container_name: soma-frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - backend
